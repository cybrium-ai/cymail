[package]
name = "cymail"
version = "0.6.4"
edition = "2021"
authors = ["Cybrium AI <hello@cybrium.ai>"]
description = "Email security scanner — SPF/DKIM/DMARC posture, discovery, reputation, hardware-RoT attestation"
license = "Apache-2.0"
repository = "https://github.com/cybrium-ai/cymail"
keywords = ["email", "security", "spf", "dkim", "dmarc"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "cymail"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
colored = "2"
hickory-resolver = "0.25"
# v0.2 — discovery + reputation HTTP clients (crt.sh, EmailRep.io).
# Rustls-only so the binary stays statically linkable across distros
# without OpenSSL ABI churn.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rand = "0.8"
# v0.5 — exports (sarif/csv/html) need sha2 for self-update checksum
# verification + axum for the embedded web UI.
sha2 = "0.10"
axum = "0.7"
# v0.6.1 — real-time CT log streaming via certstream WS.
# Rustls-only TLS, matches reqwest's stack.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"], default-features = false }
futures = "0.3"
# v0.6.3 — BIMI VMC PKIX chain validation. x509-parser is the pure-Rust
# DER walker; oid-registry + time come along as direct deps so the
# code can spell out the BIMI EKU OID and compare against validity.
x509-parser  = "0.16"
oid-registry = "0.7"
time         = "0.3"
# v0.6.4 — DMARC aggregate (RUA) XML parser + .zip/.gz unpack.
quick-xml = { version = "0.36", features = ["serialize"] }
flate2    = "1"
zip       = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
strip = true
