name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write    # GHCR push for the cymail container image
  id-token: write    # OIDC federated token for Azure Trusted Signing (Windows)

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: cybrium-ai-linux
            name: cymail-linux-amd64
            sign: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: cymail-linux-arm64
            sign: false
          - target: x86_64-apple-darwin
            os: macos-14
            name: cymail-darwin-amd64
            sign: true
          - target: aarch64-apple-darwin
            os: macos-14
            name: cymail-darwin-arm64
            sign: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: cymail-windows-amd64.exe
            sign: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --target ${{ matrix.target }}

      # ── Apple code signing (macOS builds only) ─────────────────────
      - name: Import Apple signing certificate
        if: matrix.sign
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Sign macOS binary
        if: matrix.sign
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp --options runtime target/${{ matrix.target }}/release/cymail
          codesign --verify --deep --strict target/${{ matrix.target }}/release/cymail
          echo "Signed and verified: ${{ matrix.name }}"

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cymail dist/${{ matrix.name }}
          chmod +x dist/${{ matrix.name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/cymail.exe dist/${{ matrix.name }}

      # ── MSI installer (Windows only) ───────────────────────────────
      # cargo-wix builds a Windows MSI from wix/main.wxs, reusing the
      # already-built release .exe. The MSI is signed alongside the
      # standalone .exe (files-folder-filter widened to exe,msi).
      - name: Install cargo-wix
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --version 0.3.9

      - name: Build MSI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo wix --no-build --nocapture `
            --target ${{ matrix.target }} `
            --output dist\cymail-windows-amd64.msi
          Get-ChildItem dist

      # ── Azure Trusted Signing (Windows binaries only) ──────────────
      # Federated OIDC — no client_secret. Subject filter on the FIC
      # is ref:refs/tags/v* so PR jobs literally cannot mint a token.
      # azure/login MUST run before trusted-signing-action so the
      # DefaultAzureCredential chain finds an OIDC token to use.
      - name: Azure login (federated OIDC)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign Windows binary via Azure Trusted Signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: Azure/trusted-signing-action@v0.5
        with:
          azure-tenant-id:              ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id:              ${{ secrets.AZURE_CLIENT_ID }}
          endpoint:                     https://cus.codesigning.azure.net/
          trusted-signing-account-name: cybrium-signing
          certificate-profile-name:     cybrium
          files-folder:                 dist
          files-folder-filter:          exe,msi
          file-digest:                  SHA256
          timestamp-rfc3161:            http://timestamp.acs.microsoft.com
          timestamp-digest:             SHA256

      - name: Verify Windows signatures (exe + msi)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          foreach ($file in @("dist/${{ matrix.name }}", "dist/cymail-windows-amd64.msi")) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$file"
            Write-Host "  Status: $($sig.Status)"
            Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "Signature verification failed for $file : $($sig.Status)" }
          }

      - name: Notarize macOS binary
        if: matrix.sign
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/${{ matrix.name }} /tmp/${{ matrix.name }}.zip
          xcrun notarytool submit /tmp/${{ matrix.name }}.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          echo "Notarization complete for ${{ matrix.name }}"

      # Windows artifact is already signed in place by the previous
      # step on tag pushes (no-op on PRs). All platforms upload under
      # the canonical matrix.name so downstream jobs are uniform.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

      - name: Upload MSI artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cymail-windows-amd64.msi
          path: dist/cymail-windows-amd64.msi

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && sha256sum * >> ../checksums.txt)
          done
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/cymail-linux-amd64/cymail-linux-amd64
            artifacts/cymail-linux-arm64/cymail-linux-arm64
            artifacts/cymail-darwin-amd64/cymail-darwin-amd64
            artifacts/cymail-darwin-arm64/cymail-darwin-arm64
            artifacts/cymail-windows-amd64.exe/cymail-windows-amd64.exe
            artifacts/cymail-windows-amd64.msi/cymail-windows-amd64.msi
            artifacts/checksums.txt

      # ── Auto-publish Homebrew formula to cybrium-ai/homebrew-cli ──
      - name: Resolve version
        id: ver
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract per-platform SHA256s
        id: sums
        run: |
          {
            echo "darwin_arm64_sha=$(awk '/cymail-darwin-arm64$/  {print $1}' artifacts/checksums.txt)"
            echo "darwin_amd64_sha=$(awk '/cymail-darwin-amd64$/  {print $1}' artifacts/checksums.txt)"
            echo "linux_arm64_sha=$(awk  '/cymail-linux-arm64$/   {print $1}' artifacts/checksums.txt)"
            echo "linux_amd64_sha=$(awk  '/cymail-linux-amd64$/   {print $1}' artifacts/checksums.txt)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: cybrium-ai/homebrew-cli
          token:      ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path:       homebrew-cli

      # ── GHCR multi-arch image ──────────────────────────────────────
      # Uses the prebuilt linux binaries from the matrix `build` job so we
      # don't recompile inside Docker. The runtime image is debian-slim
      # plus ca-certificates + tini; payloads/rules are baked in at
      # /opt/cymail so the SentinelAI cymail_runner can invoke
      #   cymail scan ... --payloads /opt/cymail/payloads
      # without bind-mounting anything from the host or the K8s pod.
      - name: Render + commit Formula/cymail.rb
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          BASE="https://github.com/cybrium-ai/cymail/releases/download/v${VERSION}"
          mkdir -p homebrew-cli/Formula
          cat > homebrew-cli/Formula/cymail.rb <<RUBY
          class Cymail < Formula
            desc     "Cybrium Web — fast web vulnerability scanner"
            homepage "https://github.com/cybrium-ai/cymail"
            license  "Apache-2.0"
            version  "${VERSION}"

            on_macos do
              on_arm do
                url    "${BASE}/cymail-darwin-arm64"
                sha256 "${{ steps.sums.outputs.darwin_arm64_sha }}"
              end
              on_intel do
                url    "${BASE}/cymail-darwin-amd64"
                sha256 "${{ steps.sums.outputs.darwin_amd64_sha }}"
              end
            end

            on_linux do
              on_arm do
                url    "${BASE}/cymail-linux-arm64"
                sha256 "${{ steps.sums.outputs.linux_arm64_sha }}"
              end
              on_intel do
                url    "${BASE}/cymail-linux-amd64"
                sha256 "${{ steps.sums.outputs.linux_amd64_sha }}"
              end
            end

            def install
              if OS.mac? && Hardware::CPU.arm?
                bin.install "cymail-darwin-arm64" => "cymail"
              elsif OS.mac? && Hardware::CPU.intel?
                bin.install "cymail-darwin-amd64" => "cymail"
              elsif OS.linux? && Hardware::CPU.arm?
                bin.install "cymail-linux-arm64" => "cymail"
              else
                bin.install "cymail-linux-amd64" => "cymail"
              end
            end

            test do
              assert_match "cymail", shell_output("#{bin}/cymail version")
            end
          end
          RUBY
          cd homebrew-cli
          git config user.name  "cybrium-bot"
          git config user.email "bot@cybrium.ai"
          git add Formula/cymail.rb
          git commit -m "cymail: bump to v${VERSION}" || echo "no changes"
          git push

